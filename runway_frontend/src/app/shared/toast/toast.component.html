<div class="toast-container">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast" [style.--duration]="t.duration + 'ms'">
      <div class="toast-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="toast-body">
        <span class="toast-message">{{ t.message }}</span>
        @if (t.submessage) {
          <span class="toast-sub">{{ t.submessage }}</span>
        }
      </div>
      <button class="toast-close" (click)="toast.dismiss(t.id)">✕</button>
      <div class="toast-progress" [style.animation-duration]="t.duration + 'ms'"></div>
    </div>
  }
</div>
