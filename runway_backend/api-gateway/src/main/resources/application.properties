spring.application.name=api-gateway
server.port=9191

eureka.instance.prefer-ip-address=true

# 2. Use your local IP (127.0.0.1) for internal routing
eureka.instance.ip-address=127.0.0.1

eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=*

#spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
#spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
#spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false


springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

springdoc.swagger-ui.urls[0].url=/service/auth-service/v3/api-docs
springdoc.swagger-ui.urls[0].name=Auth Service

springdoc.swagger-ui.urls[1].url=/service/catalog-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Catalog Service

springdoc.swagger-ui.urls[2].url=/service/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Order Service

springdoc.swagger-ui.urls[3].url=/service/customer-engagement-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Customer Engagement Service

springdoc.swagger-ui.urls[4].url=/service/payment-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Payment Service

# NOTE: The api-docs proxy routes are defined in GatewayConfig.java (no auth filter applied).
# They rewrite /service/<name>/v3/api-docs -> /v3/api-docs on each downstream service.

# --- Routes for Auth Service ---
spring.cloud.gateway.server.webflux.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/admin/**

# --- Routes for Catalog/Product Service ---
# 1. Product Management
spring.cloud.gateway.server.webflux.routes[1].id=CATALOG-SERVICE-PRODUCTS
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog/products/**

# 2. Inventory Management
spring.cloud.gateway.server.webflux.routes[2].id=CATALOG-SERVICE-INVENTORY
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/catalog/inventory/**

# 3. Category Management
spring.cloud.gateway.server.webflux.routes[3].id=CATALOG-SERVICE-CATEGORIES
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/catalog/categories/**

#Routes for Order/Cart/Shipment Service
spring.cloud.gateway.server.webflux.routes[4].id=ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/cart/**,/api/orders/**,/api/shipments/**


#Routes for Payment Service
spring.cloud.gateway.server.webflux.routes[5].id=PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/payment/**

# Routes for Customer Engagement Service
spring.cloud.gateway.server.webflux.routes[6].id=CUSTOMER-ENGAGEMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].uri=lb://CUSTOMER-ENGAGEMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/products/**,/reviews/**,/ratings/**,/notification-templates/**,/notification-logs/**,/tickets/**

