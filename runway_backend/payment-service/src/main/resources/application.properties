spring.application.name=PAYMENT-SERVICE
server.port=56272

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Razorpay Test Credentials
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ================================================
# Eureka Client Configuration
# ================================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ================================================
# OpenFeign Configuration
# ================================================
# Enable Feign clients
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Logging for Feign (useful for debugging)
logging.level.com.yourpackage.feign=DEBUG

# --- 1. Actuator Configuration ---
# Expose health and resilience 4j endpoints to the web
management.endpoints.web.exposure.include=health,info,circuitbreakers,ratelimiters

# Show full details in the /health endpoint (helpful for debugging)
management.endpoint.health.show-details=always
# Enable health indicators for Resilience4j
management.health.circuitbreakers.enabled=true


# --- 2. Resilience 4j Circuit Breaker Configuration ---
# 'paymentService' is the name we will use in the @CircuitBreaker annotation
resilience4j.circuitbreaker.instances.paymentService.registerHealthIndicator=true

# If 50% of requests fail, open the circuit
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50

# The number of requests to look at before calculating the failure rate
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10

# How long the circuit stays OPEN before trying again (HALF-OPEN)
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s

# Number of requests allowed in HALF-OPEN state to test if the service is back up
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=3


# --- 3. Resilience 4j Retry Configuration (Optional but Recommended) ---
resilience4j.retry.instances.paymentService.maxAttempts=3
resilience4j.retry.instances.paymentService.waitDuration=2s

# Retry configuration for shipment workflow trigger (LOOPHOLE FIX #8)
resilience4j.retry.instances.shipmentWorkflow.maxAttempts=3
resilience4j.retry.instances.shipmentWorkflow.waitDuration=2s
#resilience4j.retry.instances.shipmentWorkflow.retryExceptions=java.io.IOException,org.springframework.web.client.HttpServerErrorException

# ================================================
# Swagger/OpenAPI Configuration
# ================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
springdoc.cache.disabled=true
