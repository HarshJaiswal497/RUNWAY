# =============================================================
# ORDER SERVICE ? application.properties
# Port    : 2000
# Database: order_db
# Package : com.runway.order
# =============================================================

spring.application.name=ORDER-SERVICE
server.port=2000
# 1.Prefer IP over Hostname
eureka.instance.prefer-ip-address=true

# 2. Use your local IP (127.0.0.1) for internal routing
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# ?? Database ??????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=OrderPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.cloud.openfeign.httpclient.hc5.enabled=true

# ?? JPA / Hibernate ???????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ?? Flyway ????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


# ?? Swagger ???????????????????????????????????????????????????
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

# ?? Actuator ??????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ?? Jackson ???????????????????????????????????????????????????
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ?? Logging ???????????????????????????????????????????????????
logging.level.com.runway.order=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ?? Error ?????????????????????????????????????????????????????
server.error.include-message=always
server.error.include-binding-errors=always

# ?? Feign Client Configuration ?????????????????????????????
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=full
logging.level.com.runway.order.client=DEBUG

