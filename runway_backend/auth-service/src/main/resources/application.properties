spring.application.name=auth-service
server.port=9090
# 1.Prefer IP over Hostname
eureka.instance.prefer-ip-address=true

# 2. Use your local IP (127.0.0.1) for internal routing
eureka.instance.ip-address=127.0.0.1

# 3. (Optional) Force the instance ID to show the IP in the dashboard
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
#Database Configurations
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin seed configuration
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

#JWT
jwt.secretKey=${JWT_SECRET}

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.use-management-port=false

#Registering with Eureka Client
eureka.instance.client.serveUrl.defaultZone=http://localhost:8761/eureka/

#Actuator
management.endpoints.web.exposure.include=health,info,metrics